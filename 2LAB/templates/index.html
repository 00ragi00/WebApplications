{% extends 'base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-body py-5">
                <i class="bi bi-house-door-fill text-primary" style="font-size: 3rem;"></i>
                <h1 class="mt-3 fw-bold">Добро пожаловать!</h1>
                <p class="text-muted lead">Это главная страница Flask-приложения.</p>
                <p class="text-muted">Войдите или изучите доступные страницы.</p>
                <a href="{{ url_for('login') }}" class="btn btn-primary me-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Войти
                </a>
                <a href="{{ url_for('info') }}" class="btn btn-outline-primary me-2">
                    <i class="bi bi-info-circle me-1"></i>Данные запроса
                </a>
                <a href="{{ url_for('phone') }}" class="btn btn-outline-success">
                    <i class="bi bi-telephone me-1"></i>Телефон
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
