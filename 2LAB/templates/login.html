{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-lock text-primary" style="font-size: 2.5rem;"></i>
                    <h2 class="fw-bold mt-2">Вход в систему</h2>
                    <p class="text-muted small">Введите свои учётные данные</p>
                </div>
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Логин</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Введите логин"
                                   value="{{ request.form.get('username', '') }}" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Пароль</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Введите пароль" required>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Войти
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% if submitted %}
<div class="row justify-content-center mt-3">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">
                    <i class="bi bi-card-list text-info me-2"></i>Параметры формы (POST)
                </h5>
                <table class="table table-bordered table-sm mb-0">
                    <thead class="table-light">
                        <tr><th>Поле</th><th>Значение</th></tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><code>username</code></td>
                            <td>{{ submitted.username }}</td>
                        </tr>
                        <tr>
                            <td><code>password</code></td>
                            <td>{{ submitted.password }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endif %}
{% endblock %}
