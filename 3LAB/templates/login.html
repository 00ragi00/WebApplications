{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-lock text-primary" style="font-size: 2.5rem;"></i>
                    <h2 class="fw-bold mt-2">Вход в систему</h2>
                    <p class="text-muted small">Введите свои учётные данные</p>
                </div>
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Логин</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Введите логин" value="{{ request.form.get('username', '') }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Пароль</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Введите пароль" required>
                        </div>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Войти
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <p class="text-center text-muted small mt-3">
            Тестовые данные: логин <code>user</code>, пароль <code>qwerty</code>
        </p>
    </div>
</div>
{% endblock %}
